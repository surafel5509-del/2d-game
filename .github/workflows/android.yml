name: android-ci

on:
  push:
    branches: ['arena/36e85c2a-2d-game', 'main']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    name: Native host tests (C++ engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ make
      - name: Run native test suite
        run: ./scripts/run_native_tests.sh

  apk:
    name: Android APK (debug + release)
    runs-on: ubuntu-latest
    needs: native-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate sdkmanager
        id: sdk
        run: |
          set -e
          if command -v sdkmanager >/dev/null 2>&1; then
            echo "bin=$(command -v sdkmanager)" >> "$GITHUB_OUTPUT"
          else
            BIN="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n1)"
            test -x "$BIN"
            echo "bin=$BIN" >> "$GITHUB_OUTPUT"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Accept licenses & install SDK packages
        run: |
          set -e
          yes | "${{ steps.sdk.outputs.bin }}" --licenses >/dev/null 2>&1 || true
          "${{ steps.sdk.outputs.bin }}" --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"

      - name: Generate Gradle wrapper 8.4
        run: gradle wrapper --gradle-version 8.4 --distribution-type bin --no-daemon

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Collect APKs
        run: |
          set -e
          mkdir -p dist
          find app/build/outputs/apk -name '*.apk' -exec cp -v {} dist/ \;
          ls -la dist/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nebula-engine-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
